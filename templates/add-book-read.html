{% extends 'navbar.html' %}
{% load static %}


 {% block body %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Book Read - My Book Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #1a1f3a;
            --secondary: #232d52;
            --accent: #00d4ff;
            --accent-hover: #00b8d4;
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --border: #2d3748;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--primary);
            color: var(--text-primary);
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 600px;
            margin: 2rem auto;
            background: var(--secondary);
            padding: 2rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.8rem;
            background: linear-gradient(135deg, var(--accent), #00a8b5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        input, select, textarea {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 0.95rem;
            transition: all 0.3s ease;
            font-family: inherit;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        button {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .btn-submit {
            background: var(--accent);
            color: var(--primary);
        }

        .btn-submit:hover {
            background: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0, 212, 255, 0.3);
        }

        .btn-cancel {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .btn-cancel:hover {
            background: var(--primary);
            border-color: var(--accent);
            color: var(--text-primary);
        }

        @media (max-width: 768px) {
            .container {
                margin: 0;
                border-radius: 0;
                padding: 1.5rem;
            }
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        .alert {
          padding: 1rem;
          border-radius: 8px;
          margin-bottom: 1rem;
          font-weight: 600;
          text-align: center;
        }

        .alert-success {
          background: var(--success);
          color: var(--primary);
          box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .alert-error {
          background: #ef4444;
          color: #fff;
        }

        .alert-info {
          background: #3b82f6;
          color: #fff;
        }
    </style>
</head>
<body>



 {% if messages %}
  <div class="messages">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">
        {{ message }}
      </div>
    {% endfor %}
  </div>
{% endif %}

    <div class="container">
        <h1>Add Book Read</h1>

        <!-- Added enctype="multipart/form-data" to support file uploads -->
        <form action="/add-book-read/" method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="form-row">
                <div class="form-group">
                    <label for="title">Book Title </label>
                    <input type="text" id="title" name="title" placeholder="e.g., The Midnight Library" required>
                </div>
                <div class="form-group">
                    <label for="author">Author </label>
                    <input type="text" id="author" name="author" placeholder="e.g., Matt Haig" required>
                </div>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="genre">Genre </label>
                    <select id="genre" name="genre" required>
                        <option value="">-- Select Genre --</option>
                        <option value="Fiction">Fiction</option>
                        <option value="Non-Fiction">Non-Fiction</option>
                        <option value="Romance">Romance</option>
                        <option value="Science">Science</option>
                        <option value="Thriller">Thriller</option>
                        <option value="Biography">Biography</option>
                        <option value="Self-Help">Self-Help</option>
                        <option value="Fantasy">Fantasy</option>
                        <option value="Mystery">Mystery</option>
                        <option value="Poetry">Poetry</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="rating">Rating (1–5) </label>
                    <select id="rating" name="rating" required>
                        <option value="">-- Select Rating --</option>
                        <option value="5">⭐⭐⭐⭐⭐ - Excellent</option>
                        <option value="4">⭐⭐⭐⭐ - Very Good</option>
                        <option value="3">⭐⭐⭐ - Good</option>
                        <option value="2">⭐⭐ - Fair</option>
                        <option value="1">⭐ - Poor</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="date_started">Date Started </label>
                    <input type="date" id="date_started" name="date_started" required>
                </div>
                <div class="form-group">
                    <label for="date_ended">Date Ended </label>
                    <input type="date" id="date_ended" name="date_ended" required>
                </div>
            </div>

            <div class="form-group">
                <!-- Changed from URL input to file input for image uploads -->
                <label for="cover_image">Cover Image</label>
                <input type="file" id="cover_image" name="cover_image" accept="image/*">
            </div>

            <div class="button-group">
                <button type="submit" class="btn-submit">Add Book</button>
                <a href="/list-books/" style="flex:1; text-decoration:none;">
                    <button type="button" class="btn-cancel">Cancel</button>
                </a>
            </div>

        </form>
    </div>

 <script>

  setTimeout(() => {
    document.querySelectorAll('.alert').forEach(el => el.remove());
  }, 4000); // 4 seconds
</script>

{% endblock %}
</body>
</html>
